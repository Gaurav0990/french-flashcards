<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set 22 — Double Pronouns</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f8f8f6;color:#1a1a1a;padding:16px;max-width:680px;margin:0 auto}
h1{font-size:20px;font-weight:500;margin-bottom:4px}
.subtitle{font-size:13px;color:#888;margin-bottom:16px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.controls select,.controls button{font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#1a1a1a;cursor:pointer}
.controls button:hover{background:#f0f0ee}
.btn-clear{color:#993C1D;border-color:#F5C4B3}.btn-clear:hover{background:#FAECE7}
.stats{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.stat{background:#f0f0ee;border-radius:8px;padding:6px 12px;font-size:12px;color:#666}
.stat span{font-weight:500;color:#1a1a1a;font-size:14px;display:block}
.saved-badge{font-size:11px;color:#0F6E56;background:#E1F5EE;padding:3px 10px;border-radius:20px;display:none}
.prog-bg{background:#e8e8e5;border-radius:4px;height:4px;margin-bottom:8px}
.prog-fill{background:#1D9E75;height:4px;border-radius:4px;transition:width 0.3s}
.counter{font-size:12px;color:#888;text-align:center;margin-bottom:10px}
.card-wrap{margin-bottom:10px;cursor:pointer}
.face{border-radius:12px;border:1px solid #e0e0dd;background:#fff;padding:20px;display:flex;flex-direction:column;justify-content:space-between;min-height:210px;transition:opacity 0.15s}
.face.hidden{display:none}
.badges{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.badge{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:500}
.b-beg{background:#EAF3DE;color:#27500A}
.b-int{background:#FEF3C7;color:#92400E}
.b-topic{background:#f0f0ee;color:#555;font-weight:400}
.card-word{font-size:22px;font-weight:500;color:#1a1a1a;flex:1;display:flex;align-items:center;line-height:1.3}
.card-hint{font-size:12px;color:#aaa;margin-top:8px}
.card-trans{font-size:18px;font-weight:500;color:#1a1a1a}
.card-note{font-size:13px;color:#555;margin-top:6px}
.card-note-red{font-size:12px;color:#993C1D;background:#FAECE7;padding:4px 8px;border-radius:6px;margin-top:6px}
.card-ex{font-size:13px;color:#888;font-style:italic;margin-top:10px;padding-top:10px;border-top:1px solid #f0f0ee}
.mark-row{display:none;gap:8px;margin-top:8px}
.mark-row button{flex:1;padding:7px;font-size:13px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer}
.btn-k{color:#0F6E56;border-color:#9FE1CB}.btn-k:hover{background:#E1F5EE}
.btn-a{color:#993C1D;border-color:#F5C4B3}.btn-a:hover{background:#FAECE7}
.nav-row{display:flex;gap:8px;margin-top:8px}
.nav-row button{flex:1;padding:7px;font-size:13px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#1a1a1a;cursor:pointer}
.nav-row button:hover{background:#f0f0ee}
.done{text-align:center;padding:2rem 1rem;background:#fff;border-radius:12px;border:1px solid #e0e0dd}
.done .big{font-size:44px;font-weight:500}
.done .sub{font-size:14px;color:#888;margin:8px 0 20px}
.done button{padding:8px 20px;font-size:13px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer;margin:4px}
.done button:hover{background:#f0f0ee}
.dir-badge{font-size:11px;color:#888;text-align:right}
.modal-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;z-index:100}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:20px;max-width:340px;width:90%;box-shadow:0 4px 24px rgba(0,0,0,0.12)}
.modal h3{font-size:15px;font-weight:500;margin-bottom:12px}
.modal textarea{width:100%;height:80px;font-size:13px;padding:8px;border:1px solid #ddd;border-radius:8px;font-family:monospace;resize:none}
.modal .modal-btns{display:flex;gap:8px;margin-top:10px}
.modal .modal-btns button{flex:1;padding:7px;font-size:13px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer}
.modal .modal-btns button:hover{background:#f0f0ee}
.btn-import-apply{background:#EAF3DE!important;color:#27500A;border-color:#9FE1CB!important}
</style>
</head>
<body>
<h1>Set 22 — Double Pronouns</h1>
<p class="subtitle">COD + COI · COD + y · COI + en · pronoun order · imperative placement</p>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3 id="modal-title">Export progress</h3>
    <textarea id="modal-text" placeholder="Paste your code here..."></textarea>
    <div class="modal-btns">
      <button onclick="closeModal()">Cancel</button>
      <button id="modal-action-btn" onclick="modalAction()">Copy code</button>
    </div>
  </div>
</div>

<div class="controls">
  <select id="ftopic">
    <option value="all">All topics</option>
    <option value="basics">Objects and pronoun order</option>
    <option value="cod-coi">COD + COI combinations</option>
    <option value="cod-y">COD + Y</option>
    <option value="coi-en">COI + EN</option>
    <option value="negative-question">Negative and questions</option>
    <option value="imperative">Imperative placement</option>
    <option value="mistakes">Common mistakes</option>
  </select>
  <button onclick="shuffle()">Shuffle</button>
  <button onclick="toggleDir()">Flip direction</button>
  <button onclick="reviewAgain()" id="btn-review" style="display:none">Review practice (0)</button>
  <button onclick="openExport()">Export</button>
  <button onclick="openImport()">Import</button>
  <button class="btn-clear" onclick="confirmClear()">Clear progress</button>
</div>
<span class="saved-badge" id="saved-badge">Progress saved</span>

<div class="stats">
  <div class="stat"><span id="st">0</span>total</div>
  <div class="stat"><span id="sk">0</span>know it</div>
  <div class="stat"><span id="sa">0</span>practice</div>
  <div class="stat"><span id="sl">0</span>left</div>
</div>

<div class="prog-bg"><div class="prog-fill" id="prog" style="width:0%"></div></div>
<div class="counter" id="ctr">—</div>
<div id="area"></div>

<script>
const DECK_ID='set22';
const ALL=[
// BASICS AND ORDER
{f:"COD pronouns",e:"me, te, le, la, l', nous, vous, les",ex:"Je donne le dossier à Marie. → Je LE donne.",note:"COD = complément d'objet direct, answers 'what/who receives the action directly?'",topic:"basics",diff:"beginner"},
{f:"COI pronouns",e:"me, te, lui, nous, vous, leur",ex:"Je parle à Marie. → Je LUI parle.",note:"COI = complément d'objet indirect, answers 'to whom/to what?'",topic:"basics",diff:"beginner"},
{f:"Y and EN in double pronouns",e:"Y = place or à + thing, EN = de + thing/quantity",ex:"Je mets les clés dans le tiroir. → Je les Y mets.",note:"Y replaces a place or inanimate à-complement, not a person.",topic:"basics",diff:"beginner"},
{f:"The master pronoun order",e:"me/te/se/nous/vous → le/la/les → lui/leur → y → en",ex:"Je me le rappelle. / Je le lui donne. / Je les y mets. / Je lui en parle.",note:"This order is fixed for ordinary affirmative sentences. Memorize the sequence.",topic:"basics",diff:"intermediate"},
// COD + COI
{f:"Je donne le dossier à Marie. →",e:"Je le lui donne. (I give it to her.)",ex:"le (dossier, COD) + lui (à Marie, COI)",note:"COD comes before COI in the standard order.",topic:"cod-coi",diff:"intermediate"},
{f:"Tu prêtes ta voiture à ton frère. →",e:"Tu la lui prêtes. (You lend it to him.)",ex:"la (voiture, fem. COD) + lui (à ton frère, COI)",note:"la stays before lui, same pattern regardless of gender.",topic:"cod-coi",diff:"intermediate"},
{f:"Nous envoyons les documents à nos clients. →",e:"Nous les leur envoyons. (We send them to them.)",ex:"les (documents, COD) + leur (à nos clients, COI plural)",note:"leur is COI plural — do not confuse with leurs (possessive).",topic:"cod-coi",diff:"intermediate"},
{f:"Il offre trois livres à sa sœur. →",e:"Il lui en offre trois. (He gives her three.)",ex:"This is COI + EN + quantity, not COD + COI, since 'trois livres' becomes 'en... trois'.",note:"When there's a quantity, use en and keep the number after the verb.",topic:"cod-coi",diff:"intermediate"},
// COD + Y
{f:"Je mets les clés dans le tiroir. →",e:"Je les y mets. (I put them there.)",ex:"les (clés, COD) + y (dans le tiroir, place)",note:"Y replaces the place, not a person.",topic:"cod-y",diff:"intermediate"},
{f:"Tu apportes les documents au bureau. →",e:"Tu les y apportes. (You take them there.)",ex:"les (documents) + y (au bureau, place)",note:"Common error: *Je y la mets — wrong order. Correct: Je l'y mets.",topic:"cod-y",diff:"intermediate"},
// COI + EN
{f:"Je parle de ce problème à mon professeur. →",e:"Je lui en parle. (I speak to him/her about it.)",ex:"lui (à mon professeur, COI) + en (de ce problème)",note:"COI comes before EN in the order.",topic:"coi-en",diff:"intermediate"},
{f:"Je donne des conseils à mes étudiants. →",e:"Je leur en donne. (I give them some.)",ex:"leur (à mes étudiants, COI) + en (des conseils)",note:"en replaces 'des conseils' — an indefinite quantity.",topic:"coi-en",diff:"intermediate"},
{f:"⚠ Common EN mistake",e:"✗ Je en lui parle → ✓ Je lui en parle",ex:"The pronoun order lui + en must be respected — en cannot jump ahead.",note:"Always double-check pronoun order: COI before EN, never the reverse.",topic:"coi-en",diff:"intermediate"},
// ME/TE/SE + COD
{f:"Je me rappelle cette information. →",e:"Je me la rappelle. (I remind myself of it.)",ex:"me (reflexive) + la (cette information, COD)",note:"Reflexive pronoun always comes first in the sequence.",topic:"basics",diff:"intermediate"},
{f:"Il se demande la raison. →",e:"Il se la demande. (He asks himself about it.)",ex:"se + la (la raison, COD)",note:"se/me/te/nous/vous always precede le/la/les.",topic:"basics",diff:"intermediate"},
// NEGATIVE AND QUESTIONS
{f:"Negative pattern",e:"ne + pronoun1 + pronoun2 + verb + pas",ex:"Je ne le lui donne pas. / Nous ne les leur envoyons pas.",note:"Both pronouns stay together right before the verb, wrapped by ne...pas.",topic:"negative-question",diff:"intermediate"},
{f:"Est-ce que tu le lui donnes ?",e:"Are you giving it to him/her?",ex:"Question word order keeps both pronouns before the verb, same as statements.",note:"Inversion or est-ce que doesn't change pronoun placement.",topic:"negative-question",diff:"intermediate"},
{f:"Two-verb structures",e:"Pronouns go immediately before the verb they belong to (usually the infinitive)",ex:"Je vais le lui donner. / Elle doit lui en parler.",note:"With aller/vouloir/devoir + infinitive, pronouns attach to the infinitive, not the conjugated verb.",topic:"negative-question",diff:"intermediate"},
// IMPERATIVE
{f:"Affirmative imperative order",e:"verb → le/la/les-moi/toi/lui/nous/vous/leur → y → en, connected by hyphens",ex:"Donne-le-lui ! / Montrez-les-lui ! / Parle-lui-en !",note:"Pronouns move AFTER the verb only in affirmative commands.",topic:"imperative",diff:"intermediate"},
{f:"me → moi, te → toi in affirmative imperative",e:"Explique-le-moi ! (Explain it to me!)",ex:"Donne-la-moi ! (Give it to me!)",note:"me/te become moi/toi only in affirmative commands, not negative ones.",topic:"imperative",diff:"intermediate"},
{f:"Negative imperative pronoun order",e:"Pronouns return to their normal position BEFORE the verb",ex:"Ne le lui donne pas ! / Ne me le donne pas !",note:"Negative commands use the same order as regular sentences, not the flipped affirmative order.",topic:"imperative",diff:"intermediate"},
{f:"Pense à ce problème ! →",e:"Penses-y ! (Think about it!)",ex:"Note the extra -s added to pense before y for pronunciation: Penses-y.",note:"An -s is added to certain tu-form imperatives before y or en for liaison.",topic:"imperative",diff:"intermediate"},
// COMMON MISTAKES
{f:"✗ Je lui le donne.",e:"✓ Je le lui donne.",ex:"COD (le) must come before COI (lui) in the standard order.",note:"This is one of the most frequent word-order errors.",topic:"mistakes",diff:"intermediate"},
{f:"✗ Donne lui le !",e:"✓ Donne-le-lui !",ex:"In the affirmative imperative, COD comes before COI, connected with hyphens.",note:"Imperative order is COD then COI, opposite of what some learners expect.",topic:"mistakes",diff:"intermediate"},
{f:"✗ Je les mets y.",e:"✓ Je les y mets.",ex:"Y must come immediately before the verb, not after the other pronoun.",note:"Y and en always sit closest to the verb in the pronoun cluster.",topic:"mistakes",diff:"intermediate"},
{f:"✗ Je vais chez Paul → Je y vais",e:"✓ J'y vais (I'm going there)",ex:"Chez lui refers to a person's place; y replaces the destination generally.",note:"Distinguish: Je vais chez lui (to his place) vs J'y vais (there, in general).",topic:"mistakes",diff:"intermediate"},
];

let deck=[],cur=0,flipped=false,showFR=false,known=new Set(),again=new Set();
function saveProgress(){try{localStorage.setItem('fc_known_'+DECK_ID,JSON.stringify([...known]));localStorage.setItem('fc_again_'+DECK_ID,JSON.stringify([...again]));localStorage.setItem('fc_cur_'+DECK_ID,String(cur));localStorage.setItem('fc_dir_'+DECK_ID,showFR?'1':'0');localStorage.setItem('fc_topic_'+DECK_ID,document.getElementById('ftopic').value);showSaved();}catch(e){}}
function loadProgress(){try{const t=localStorage.getItem('fc_topic_'+DECK_ID);if(t)document.getElementById('ftopic').value=t;const k=localStorage.getItem('fc_known_'+DECK_ID);const a=localStorage.getItem('fc_again_'+DECK_ID);const c=localStorage.getItem('fc_cur_'+DECK_ID);const d=localStorage.getItem('fc_dir_'+DECK_ID);if(k)known=new Set(JSON.parse(k));if(a)again=new Set(JSON.parse(a));if(c)cur=parseInt(c);if(d!==null)showFR=d==='1';}catch(e){}}
function confirmClear(){if(confirm('Clear all saved progress for this set?')){try{['fc_known_','fc_again_','fc_cur_','fc_dir_','fc_topic_'].forEach(k=>localStorage.removeItem(k+DECK_ID));}catch(e){}known=new Set();again=new Set();cur=0;showFR=false;build();}}
let savedTimer=null;
function showSaved(){const b=document.getElementById('saved-badge');if(b){b.style.display='inline';if(savedTimer)clearTimeout(savedTimer);savedTimer=setTimeout(()=>{b.style.display='none';},2000);}}
function build(){const t=document.getElementById('ftopic').value;deck=ALL.filter(c=>t==='all'||c.topic===t);if(cur>=deck.length)cur=0;flipped=false;updateReviewBtn();render();updateStats();}
function shuffle(){for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}cur=0;flipped=false;saveProgress();render();updateStats();}
function toggleDir(){showFR=!showFR;flipped=false;saveProgress();render();}
function updateReviewBtn(){const btn=document.getElementById('btn-review');if(btn){if(again.size>0){btn.style.display='inline';btn.textContent='Review practice ('+again.size+')';}else{btn.style.display='none';}}}
function reviewAgain(){deck=ALL.filter(c=>again.has(ALL.indexOf(c)));cur=0;flipped=false;render();updateStats();}
function updateStats(){document.getElementById('st').textContent=deck.length;document.getElementById('sk').textContent=known.size;document.getElementById('sa').textContent=again.size;document.getElementById('sl').textContent=Math.max(0,deck.length-cur);const p=deck.length?Math.round((cur/deck.length)*100):0;document.getElementById('prog').style.width=p+'%';document.getElementById('ctr').textContent=deck.length?'Card '+(cur+1)+' of '+deck.length:'No cards';updateReviewBtn();}
function render(){
  const a=document.getElementById('area');
  if(!deck.length){a.innerHTML='<p style="color:#888;padding:1rem 0">No cards for this filter.</p>';return;}
  if(cur>=deck.length){const k=known.size,ag=again.size;a.innerHTML=`<div class="done"><div class="big">${k}/${deck.length}</div><div class="sub">You knew ${k} — ${ag} marked for practice.</div><button onclick="build()">Restart</button></div>`;return;}
  const c=deck[cur];
  const idx=ALL.indexOf(c);
  const isKnown=known.has(idx);const isAgain=again.has(idx);
  const statusDot=isKnown?'<span style="font-size:11px;color:#0F6E56">✓ know it</span>':isAgain?'<span style="font-size:11px;color:#993C1D">↻ practice</span>':'';
  const diffClass=c.diff==='intermediate'?'b-int':'b-beg';
  const frontText=showFR?c.f:c.e;
  const backMeaning=showFR?c.e:c.f;
  const isWarning=c.f.startsWith('⚠');
  a.innerHTML=`<div class="card-wrap" onclick="flip()">
    <div class="face front" id="face-front">
      <div><div class="badges"><span class="badge b-topic">${c.topic}</span><span class="badge ${diffClass}">${c.diff}</span>${statusDot}</div><div class="card-word">${frontText}</div><div class="card-hint">tap to reveal</div></div>
      <div class="dir-badge">${showFR?'FR → EN':'EN → FR'}</div>
    </div>
    <div class="face back hidden" id="face-back">
      <div><div class="badges"><span class="badge b-topic">${c.topic}</span></div><div class="card-trans">${backMeaning}</div>${c.note?`<div class="${isWarning?'card-note-red':'card-note'}">${c.note}</div>`:''}<div class="card-ex">${c.ex}</div></div>
    </div>
  </div>
  <div class="mark-row" id="mr"><button class="btn-a" onclick="markA()">Practice again</button><button class="btn-k" onclick="markK()">Know it</button></div>
  <div class="nav-row"><button onclick="prev()">&#8592; Back</button><button onclick="next()">Next &#8594;</button></div>`;
  updateStats();
}
function flip(){flipped=!flipped;document.getElementById('face-front').classList.toggle('hidden',flipped);document.getElementById('face-back').classList.toggle('hidden',!flipped);document.getElementById('mr').style.display=flipped?'flex':'none';}
function markK(){const idx=ALL.indexOf(deck[cur]);known.add(idx);again.delete(idx);saveProgress();next();}
function markA(){const idx=ALL.indexOf(deck[cur]);again.add(idx);known.delete(idx);saveProgress();next();}
function next(){flipped=false;cur=Math.min(cur+1,deck.length);saveProgress();render();}
function prev(){flipped=false;cur=Math.max(cur-1,0);saveProgress();render();}
document.getElementById('ftopic').addEventListener('change',()=>{known=new Set();again=new Set();cur=0;saveProgress();build();});
loadProgress();build();
let _modalMode='export';
function openExport(){_modalMode='export';const data={known:[...known],again:[...again],cur,dir:showFR};const code=btoa(JSON.stringify(data));document.getElementById('modal-title').textContent='Export progress';document.getElementById('modal-text').value=code;document.getElementById('modal-text').readOnly=true;document.getElementById('modal-action-btn').textContent='Copy code';document.getElementById('modal-action-btn').className='';document.getElementById('modal-bg').classList.add('open');}
function openImport(){_modalMode='import';document.getElementById('modal-title').textContent='Import progress';document.getElementById('modal-text').value='';document.getElementById('modal-text').readOnly=false;document.getElementById('modal-text').placeholder='Paste your code here...';document.getElementById('modal-action-btn').textContent='Apply code';document.getElementById('modal-action-btn').className='btn-import-apply';document.getElementById('modal-bg').classList.add('open');}
function closeModal(){document.getElementById('modal-bg').classList.remove('open');}
function modalAction(){
  if(_modalMode==='export'){const t=document.getElementById('modal-text');t.select();try{navigator.clipboard.writeText(t.value).then(()=>{document.getElementById('modal-action-btn').textContent='Copied!';setTimeout(closeModal,1000);});}catch(e){document.execCommand('copy');document.getElementById('modal-action-btn').textContent='Copied!';setTimeout(closeModal,1000);}}
  else{const code=document.getElementById('modal-text').value.trim();try{const data=JSON.parse(atob(code));if(data.known)known=new Set(data.known);if(data.again)again=new Set(data.again);if(typeof data.cur==='number')cur=data.cur;if(typeof data.dir==='boolean')showFR=data.dir;saveProgress();closeModal();build();}catch(e){alert('Invalid code — please check and try again.');}}
}
</script>
</body>
</html>
